<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="outer">
    <section class="left-panel">
      <div class="logo">
        <img id="odin" src="./odin-lined.png" height="110px" />
        <p class="odin">ODIN</p>
        <div class="shade" height="120px" width="100%">abracadab</div>
      </div>
      <div class="credit">
        <p class="pic-credit">Photo by <a
            href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Halie
            West</a> on <a
            href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
        </p>
      </div>
    </section>
    <section class="right-panel">
      <div class="upper">
        <p>
          This is not a real on-line service! You know you need something like
          this in your life to help you realise your deepest dreams. Sign up
          <em>now</em> to get started.
        </p>
        <p>You <em>know</em> you want to.</p>
      </div>

      <div class="middle">
        <p>Let's do this!</p>

        <form id="entry">

          <div class="form-row">
            <div>
              <label for="first-name">FIRST NAME</label>
              <input type="text" id="first-name" name="first-name" />
            </div>
            <div>
              <label for="last-name">LAST NAME</label>
              <input type="text" id="last-name" name="last-name" />
            </div>
          </div>

          <div class="form-row">
            <div>
              <label for="email">EMAIL</label>
              <input type="email" id="email" name="email" />
            </div>
            <div>
              <label for="telephone">TELEPHONE</label>
              <input type="tel" id="telephone" name="telephone" pattern="([0-9\(\) ]+)"/>
            </div>
          </div>

          <div class="form-row">
            <div>
              <label for="password">PASSWORD</label>
              <input type="password" minlength=6 id="password" name="password" />
            </div>
            <div>
              <label for="confirm-password">CONFIRM PASSWORD</label>
              <input type="password" minlength=6 id="confirm-password" name="confirm-password" />
            </div>
          </div>

        </form>
      </div>

      <div class="lower">
        <p><button type="submit" form="entry">Create Account</button></p>
        <p>Already have an account? <a href="">Log in</a></p>
      </div>
      <div>

      </div>
    </section>
  </div>
</body>

</html>
